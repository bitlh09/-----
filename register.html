<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - GraphLearn</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .form-checkbox:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .form-radio:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <svg class="w-8 h-8 text-white mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <a href="graph_learning_website (1).html" class="text-white text-xl font-bold">GraphLearn</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-lg">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">创建新账号</h2>
            </div>
            <form class="mt-8 space-y-6" onsubmit="handleRegister(event)">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div class="mb-4">
                        <label for="username" class="block text-sm font-medium text-gray-700">用户名</label>
                        <input id="username" name="username" type="text" required class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="请输入用户名">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-gray-700">电子邮箱</label>
                        <input id="email" name="email" type="email" required class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="请输入电子邮箱">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
                        <input id="password" name="password" type="password" required class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="请输入密码">
                    </div>
                    <div class="mb-4">
                        <label for="confirm-password" class="block text-sm font-medium text-gray-700">确认密码</label>
                        <input id="confirm-password" name="confirm-password" type="password" required class="mt-1 appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="请再次输入密码">
                    </div>
                </div>

                <div class="flex items-start mb-4">
                    <div class="flex items-center h-5">
                        <input id="newsletter" name="newsletter" type="checkbox" class="form-checkbox h-4 w-4 text-indigo-600 transition duration-150 ease-in-out">
                    </div>
                    <div class="ml-3">
                        <label for="newsletter" class="text-sm text-gray-700">订阅我们的新闻通讯</label>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex items-center">
                        <label class="mr-4 text-sm font-medium text-gray-700">学习兴趣：</label>
                        <div class="space-x-4">
                            <label class="inline-flex items-center">
                                <input type="radio" name="interest" value="algorithm" class="form-radio" required>
                                <span class="ml-2">算法学习</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="interest" value="application" class="form-radio">
                                <span class="ml-2">实际应用</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="interest" value="research" class="form-radio">
                                <span class="ml-2">研究探索</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        注册
                    </button>
                </div>
            </form>

            <div class="text-center">
                <p class="text-sm text-gray-600">
                    已有账号？
                    <a href="graph_learning_website (1).html" onclick="toggleLogin(); return false;" class="font-medium text-indigo-600 hover:text-indigo-500">
                        立即登录
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const newsletter = document.getElementById('newsletter').checked;
            const interest = document.querySelector('input[name="interest"]:checked')?.value;

            // 基本验证
            if (!username) {
                alert('请输入用户名！');
                return;
            }

            if (!email) {
                alert('请输入邮箱！');
                return;
            }

            if (!password) {
                alert('请输入密码！');
                return;
            }

            if (password !== confirmPassword) {
                alert('两次输入的密码不一致！');
                return;
            }

            if (password.length < 6) {
                alert('密码长度至少需要6个字符！');
                return;
            }

            // 验证邮箱格式
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('请输入有效的邮箱地址！');
                return;
            }

            // 检查用户名是否已存在
            const users = JSON.parse(localStorage.getItem('gl_users') || '{}');
            if (users[username]) {
                alert('该用户名已被注册！');
                return;
            }

            // 保存用户信息
            users[username] = password; // 基本验证信息
            localStorage.setItem('gl_users', JSON.stringify(users));

            // 保存用户详细信息
            const userDetails = {
                email: email,
                newsletter: newsletter,
                interest: interest,
                registerDate: new Date().toISOString()
            };
            const userDetailsStore = JSON.parse(localStorage.getItem('gl_user_details') || '{}');
            userDetailsStore[username] = userDetails;
            localStorage.setItem('gl_user_details', JSON.stringify(userDetailsStore));

            // 显示成功消息
            alert('注册成功！请登录');
            window.location.href = 'graph_learning_website (1).html';
        }

        // 页面加载时检查是否已登录
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('gl_current_user');
            if (currentUser) {
                // 如果已登录，重定向到首页
                window.location.href = 'graph_learning_website (1).html';
            }
        });
    </script>
</body>
</html>
